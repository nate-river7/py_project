<!doctype html>
<html>
<head>
  <title>MovieMatch</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: auto; padding: 20px; background: #111; color: #eee; }
    a { color: #7cc4ff; }
    .card { background: #222; padding: 12px; margin: 8px 0; border-radius: 8px; }
    .match { float: right; font-weight: bold; color: #6f6; }
    .tag { display: inline-block; background: #333; padding: 2px 8px; border-radius: 10px; margin: 2px; font-size: 12px; }
  </style>
</head>
<body>
  <nav>
    <a href="{{ url_for('home') }}">Home</a> |
    <form action="{{ url_for('search') }}" style="display:inline">
      <input name="q" placeholder="Search title, actor, genre...">
      <button>Search</button>
    </form>
    {% if session.username %} | {{ session.username }} (<a href="{{ url_for('logout') }}">logout</a>){% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
